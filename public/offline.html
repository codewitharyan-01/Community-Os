<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Community OS</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #0a0a0a; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { text-align: center; max-width: 400px; padding: 2rem; }
    .mark { width: 56px; height: 56px; border-radius: 14px; background: #0a0a0a; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; }
    h1 { font-size: 18px; margin: 20px 0 8px; }
    p { color: #737373; font-size: 14px; line-height: 1.6; }
    button { margin-top: 20px; height: 40px; padding: 0 18px; border-radius: 10px; border: 0; background: #0a0a0a; color: #fff; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <span class="mark">C</span>
    <h1>You&rsquo;re offline</h1>
    <p>Community OS needs a connection for payments, visitor passes and live updates. Browsing resumes automatically once you&rsquo;re back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
